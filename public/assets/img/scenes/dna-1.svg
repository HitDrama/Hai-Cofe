<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFEBE4"/>
      <stop offset="100%" stop-color="#DDD3C5"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="72%" cy="24%" r="58%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bgGrad)"/>
  <rect width="300" height="300" fill="url(#sunGlow)"/>
