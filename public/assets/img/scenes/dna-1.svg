  <g fill="#282828" opacity="0.045">
    <polygon points="0,120 300,0 300,90 0,210"/>
    <polygon points="0,310 300,190 300,280 0,400"/>
    <polygon points="0,500 300,380 300,470 0,590"/>
  </g>
  <circle cx="150" cy="150" r="84" fill="#FBF9F5" stroke="#DDBB99" stroke-width="2"/><ellipse cx="150" cy="150" rx="28" ry="42" transform="rotate(-24 150 150)" fill="#6B442A"/>
