<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" fill="none">
  <defs>
    <linearGradient id="liq-hero" x1="210" y1="125" x2="210" y2="475" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C58B59"/>
      <stop offset="52%" stop-color="#8C4F2B"/>
      <stop offset="100%" stop-color="#4A2512"/>
    </linearGradient>
    <linearGradient id="glass-hero" x1="96" y1="120" x2="324" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.52"/>
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="82%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.38"/>
    </linearGradient>
    <radialGradient id="shadow-hero" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1610" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#1E1610" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1E1610" stop-opacity="0"/>
