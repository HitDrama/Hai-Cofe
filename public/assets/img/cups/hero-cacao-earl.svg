    <path d="M103 128h214l-6 66c-38 10-72-8-106 4-34 11-66-4-96 2l-6-72z" fill="#FBF6EC" opacity="0.96"/>
    

    <!-- Minimalist Editorial Cup Label -->
    <g transform="translate(210 326)">
